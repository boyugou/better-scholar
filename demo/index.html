<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Better Scholar — Settings</title>
  <!-- the preview borrows the Scholar page's own styling, so it is exactly what you will get -->
  <link rel="stylesheet" href="content/styles.css">
  <link rel="stylesheet" href="options/options.css">
  <meta name="robots" content="noindex">
  <script>if (self !== top) document.documentElement.classList.add("rr-embedded")</script>
  <link rel="icon" href="icons/icon-32.png">
  <link rel="stylesheet" href="demo.css">
  <link rel="preload" as="script" href="lib/i18n.js">
  <link rel="preload" as="script" href="lib/prefs.js">
  <link rel="preload" as="script" href="lib/palette.js">
  <link rel="preload" as="script" href="lib/query.js">
  <link rel="preload" as="script" href="lib/agent.js">
  <link rel="preload" as="script" href="lib/marks.js">
  <link rel="preload" as="script" href="lib/metrics.js">
  <link rel="preload" as="script" href="lib/venues.js">
  <link rel="preload" as="script" href="data/aliases.js">
  <link rel="preload" as="script" href="data/ccf.js">
  <link rel="preload" as="script" href="data/core.js">
  <link rel="preload" as="script" href="content/dom.js">
  <link rel="preload" as="script" href="content/chips.js">
  <link rel="preload" as="script" href="content/panel.js">
  <link rel="preload" as="script" href="content/store.js">
  <link rel="preload" as="script" href="options/editor.js">
  <link rel="preload" as="script" href="options/options.js">
</head>
<body>
  <div class="rr-demo-note" role="note" lang="en" dir="ltr"><b>Demo</b> <span>Your changes are kept in this browser only.</span></div>
  <div class="wrap">
    <header class="top">
      <img class="logo" src="icons/icon-48.png" alt="" width="32" height="32">
      <div class="who"><h1 id="title"></h1><p id="sub"></p></div>
      <span id="saved" role="status" aria-live="polite"></span>
    </header>
    <div class="grid">
      <main id="controls"></main>
      <aside class="preview">
        <section class="card">
          <div class="pv-header">
            <h2 id="pv-title"></h2>
          </div>
          <table class="pv"><tbody id="preview"></tbody></table>
          <p class="desc" id="pv-note"></p>
          <p class="desc pv-edit-hint" id="pv-hint"></p>
          <div id="pv-tray"></div>
          <div id="pv-panel"></div>
        </section>
      </aside>
      <footer class="foot"><span id="storage"></span> <span id="ver"></span>
        <nav class="links" aria-label="Better Scholar"><a id="lnk-privacy" target="_blank" rel="noopener"></a><a id="lnk-issues" target="_blank" rel="noopener"></a><a id="lnk-source" target="_blank" rel="noopener"></a></nav>
      </footer>
    </div>
  </div>
  <script src="demo-shim.js" data-version="2.41.0" data-scripts="lib/i18n.js lib/prefs.js lib/palette.js lib/query.js lib/agent.js lib/marks.js lib/metrics.js lib/venues.js data/aliases.js data/ccf.js data/core.js content/dom.js content/chips.js content/panel.js content/store.js options/editor.js options/options.js"></script>
</body>
</html>
