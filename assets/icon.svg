<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- four paper rows, one per authorship role (first, co-first, second, last): the colour of the role, then the rest of the row -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#27324f"/><stop offset="1" stop-color="#161d33"/></linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#g)"/>
  <rect x="18" y="20" width="32" height="16" rx="8" fill="#4d8ff5"/><rect x="56" y="20" width="54" height="16" rx="8" fill="#fff" fill-opacity=".16"/>
  <rect x="18" y="44" width="32" height="16" rx="8" fill="#b36cf6"/><rect x="56" y="44" width="40" height="16" rx="8" fill="#fff" fill-opacity=".16"/>
  <rect x="18" y="68" width="32" height="16" rx="8" fill="#fbbc04"/><rect x="56" y="68" width="48" height="16" rx="8" fill="#fff" fill-opacity=".16"/>
  <rect x="18" y="92" width="32" height="16" rx="8" fill="#34a853"/><rect x="56" y="92" width="30" height="16" rx="8" fill="#fff" fill-opacity=".16"/>
  <!-- the rank -->
  <circle cx="98" cy="96" r="22" fill="#fff"/>
  <text x="98" y="106" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="800" fill="#161d33">A</text>
</svg>
