  <rect x="20" y="52" width="26" height="17" rx="8.5" fill="#fbbc04"/>
  <rect x="52" y="52" width="36" height="17" rx="8.5" fill="#fff"/>
  <rect x="20" y="82" width="46" height="11" rx="5.5" fill="#fff" fill-opacity=".5"/>
  <circle cx="97" cy="97" r="25" fill="#202124" stroke="#1a73e8" stroke-width="5"/>
  <text x="97" y="107.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#fff">A</text>
