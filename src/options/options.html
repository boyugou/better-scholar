<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Better Scholar — Settings</title>
  <!-- the preview borrows the Scholar page's own styling, so it is exactly what you will get -->
  <link rel="stylesheet" href="../content/styles.css">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="wrap">
    <header class="top">
      <img class="logo" src="../icons/icon-48.png" alt="" width="32" height="32">
      <div class="who"><h1 id="title"></h1><p id="sub"></p></div>
      <span id="saved" role="status" aria-live="polite"></span>
    </header>
    <div class="grid">
      <main id="controls"></main>
      <aside class="preview">
        <section class="card">
          <div class="pv-header">
            <h2 id="pv-title"></h2>
          </div>
          <table class="pv"><tbody id="preview"></tbody></table>
          <p class="desc" id="pv-note"></p>
          <p class="desc pv-edit-hint" id="pv-hint"></p>
          <div id="pv-tray"></div>
          <div id="pv-panel"></div>
        </section>
      </aside>
      <footer class="foot"><span id="storage"></span> <span id="ver"></span>
        <nav class="links" aria-label="Better Scholar"><a id="lnk-privacy" target="_blank" rel="noopener"></a><a id="lnk-issues" target="_blank" rel="noopener"></a><a id="lnk-source" target="_blank" rel="noopener"></a></nav>
      </footer>
    </div>
  </div>
  <script src="../lib/i18n.js"></script>
  <script src="../lib/prefs.js"></script>
  <script src="../lib/palette.js"></script>
  <script src="../lib/query.js"></script>
  <script src="../lib/agent.js"></script>
  <script src="../lib/marks.js"></script>
  <script src="../lib/metrics.js"></script>
  <script src="../content/dom.js"></script>
  <script src="../content/chips.js"></script>
  <script src="../content/panel.js"></script>
  <script src="../content/store.js"></script>
  <script src="editor.js"></script>
  <script src="options.js"></script>
</body>
</html>
