name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-24.04          # (pinned: a new Ubuntu under "latest" can break playwright install --with-deps; move on deliberately)
    strategy:
      matrix:
        node: [22, 24]          # (the maintained LTS lines: Node 20 reached its end of life in April 2026)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: node scripts/build-data.mjs --check
      - run: npm run check:claims
      - run: scripts/package-chrome.sh

  e2e:
    runs-on: ubuntu-24.04          # (pinned: a new Ubuntu under "latest" can break playwright install --with-deps; move on deliberately)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # the extension itself has no dependencies; only the end-to-end test needs a browser driver
      - run: npm install --no-save --no-package-lock playwright@1.49.1
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:demo
      # the settings page in all 30 languages at a desktop, a half-screen and a phone width (the website's frame): nothing runs out of its box, no word is cut in two
      - run: node scripts/overflow-audit.mjs --width 1360,700,330 --scheme light
