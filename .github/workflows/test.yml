name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-24.04          # (pinned: a new Ubuntu under "latest" can break playwright install --with-deps; move on deliberately)
    strategy:
      matrix:
        node: [22, 24]          # (the maintained LTS lines: Node 20 reached its end of life in April 2026)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: node scripts/build-data.mjs --check
      - run: npm run check:claims
      - run: scripts/package-chrome.sh

  # the end-to-end checks in four independent parts, side by side (E2E_PART=1: the long profile; 3: its settings-page sections S7–S8, from a setup
  # of their own; 2 and 4: the sections with profiles of their own, 17–25 and 26 on)
  e2e:
    runs-on: ubuntu-24.04          # (pinned: a new Ubuntu under "latest" can break playwright install --with-deps; move on deliberately)
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # the extension itself has no dependencies; only the end-to-end test needs a browser driver
      - run: npm install --no-save --no-package-lock playwright@1.49.1
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          E2E_PART: ${{ matrix.part }}

  # the web demo's checks, then the settings page in all 30 languages at a desktop, a half-screen and a phone width (the website's frame):
  # nothing runs out of its box, no word is cut in two (both build the demo into dist/demo, so they run one after the other); then axe-core over
  # the panel, the settings page and the popup (half a minute)
  demo:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock playwright@1.49.1
      - run: npx playwright install --with-deps chromium
      - run: npm run test:demo
      - run: node scripts/overflow-audit.mjs --width 1360,700,330 --scheme light
      - run: node scripts/axe-audit.mjs
