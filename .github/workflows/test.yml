name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: node scripts/build-data.mjs --check
      - run: npm run check:claims
      - run: scripts/package-chrome.sh

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # the extension itself has no dependencies; only the end-to-end test needs a browser driver
      - run: npm install --no-save --no-package-lock playwright@1.49.1
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:demo
