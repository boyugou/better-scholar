name: data-fresh

# Are the bundled CCF and ICORE files still what the official sources publish? Checked every Monday (and on demand).
# A failed run (GitHub mails it) means a changed file or a newer edition (exit 1: see "Regenerate" in data/README.md), or that a source could not be
# reached or refused the check (exit 2, "no verdict": the data may be stale, and a check that stays silent for weeks is no check).
on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/check-data-fresh.mjs
