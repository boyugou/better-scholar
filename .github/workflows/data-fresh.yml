name: data-fresh

# Are the bundled CCF and ICORE files still what the official sources publish? Checked every Monday (and on demand).
# A failed run (GitHub mails it) means a changed file or a newer edition: see "Regenerate" in data/README.md.
# A source that cannot be reached is only a warning: no verdict that week.
on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: |
          set +e
          node scripts/check-data-fresh.mjs
          code=$?
          if [ "$code" = 2 ]; then echo "::warning::a source could not be reached, so there is no verdict this week"; exit 0; fi
          exit $code
